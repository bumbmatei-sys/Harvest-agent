name: CI

# Runs on `pull_request` only. The `push: branches: [main]` trigger was removed
# in THE-170: every merge ran this suite twice — once for the pull request, once
# for the commit that merge produced — and the two runs were near-duplicates.
# That, plus a build job that could never pass, exhausted the 2,000-minute
# Actions allowance on this private repo.
#
# The tradeoff, stated plainly so nobody has to rediscover it:
#
#   A `pull_request` run tests `refs/pull/N/merge` — the PR head merged into
#   `main` as it stood when the run started. That is the same tree the merge
#   produces ONLY while `main` has not moved since. It moves two ways here:
#
#     - Squash merge (48 of the last 50 commits on `main`). If another PR lands
#       between this PR's last CI run and its merge, the squash is computed
#       against the newer `main`, and the tree that reaches `main` was never
#       tested in that exact form.
#     - Rebase merge (PR #338, the other 2). Every commit but the tip is
#       replayed onto `main` having never been tested on its own.
#
#   So `main` is not "verified" — it is assembled from verified parts. If a PR
#   has sat while other PRs merged, update the branch or re-run this workflow
#   before merging rather than trusting the older green check.
#
#   `main` is also unprotected, so a commit pushed straight to it now gets no
#   CI at all.
#
# Restoring a `push` trigger would buy that certainty back at the cost of the
# double-run this removed — re-check the minute budget first.

on:
  pull_request:
    branches: [main]

# One live run per pull request. Pushing three commits to a branch used to start
# three full suites and let all three finish; superseded runs are now cancelled
# and only the newest commit is tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history, not the action's default depth-1 shallow clone.
          #
          # The desktop-layout suites diff the working tree against the revision
          # their PR branched from — `git show <rev>:src/components/X.tsx` — so
          # that "mobile is unchanged" and "no behaviour changed" are checked
          # against the real before, not a hand-typed copy of it. A depth-1
          # clone contains exactly one commit, so every one of those calls dies
          # with `fatal: invalid object name`, and the whole job fails for a
          # reason that has nothing to do with the code under test. It passes
          # locally, where the clone is complete, which is the worst version of
          # this bug: green on the machine that wrote it, red only on CI.
          #
          # Cost is a slower checkout on a repo this size; the alternative is
          # every such suite carrying a copy of the source it is diffing.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint
